# 火山云 ECS 生产部署用 compose（无 build，仅运行镜像）
# 部署目录示例：/opt/ecommerce-ai-agent/
#   .env
#   docker-compose.prod.yml
#
# 启动：
#   IMAGE_REF=cartpilot-backend:<tag> docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: ${IMAGE_REF:-cartpilot-backend:latest}
    container_name: cartpilot-backend
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      USE_RERANK: ${USE_RERANK:-1}
    ports:
      - "${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
