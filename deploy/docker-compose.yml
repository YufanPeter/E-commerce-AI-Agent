# Local development: run from the repository root.
#   docker compose -f deploy/docker-compose.yml up --build
#
# Production: use an already loaded or pulled image without triggering a build.
#   IMAGE_REF=cartpilot-backend:<tag> docker compose -f deploy/docker-compose.prod.yml up -d

services:
  backend:
    image: ${IMAGE_REF:-cartpilot-backend:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cartpilot-backend
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      USE_RERANK: ${USE_RERANK:-1}
    ports:
      - "${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Knowledge graph. Start with: --env-file .env --profile graph up -d neo4j
  neo4j:
    image: neo4j:5.26.12-community
    profiles: ["graph"]
    container_name: cartpilot-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  neo4j-data:
