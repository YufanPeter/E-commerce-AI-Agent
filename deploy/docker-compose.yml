services:
  backend:
    image: ${IMAGE_REF:-cartpilot-backend:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      USE_RERANK: ${USE_RERANK:-1}
    ports:
      - "8000:8000"
    restart: unless-stopped
